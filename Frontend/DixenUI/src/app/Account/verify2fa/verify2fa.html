<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 md:p-8">
    
    <h3 class="text-center text-2xl font-bold text-blue-600 mb-4">
      Two-Factor Authentication
    </h3>

    <p class="text-center text-gray-500 mb-6">
      Enter the 6-digit code from your authenticator app
    </p>

    <form [formGroup]="form" (ngSubmit)="verify()" class="space-y-4">

      <div>
        <label for="code" class="block text-gray-700 font-semibold mb-1">
          Authentication Code
        </label>

        <input
          type="text"
          id="code"
          formControlName="code"
          placeholder="123456"
          inputmode="numeric"
          maxlength="6"
          autocomplete="one-time-code"
          pattern="[0-9]*"
          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-500 text-gray-800"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg shadow transition duration-200 ease-in-out hover:bg-blue-700 disabled:opacity-50"
        [disabled]="form.invalid"
      >
        Verify
      </button>

      <div *ngIf="error" class="text-red-600 text-center mt-2 font-medium">
        {{ error }}
      </div>

    </form>
  </div>
</div>
